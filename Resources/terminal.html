<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPowershell Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; }
  #wrap { display: flex; width: 100%; height: 100%; }
  .term-host {
    display: none; flex-direction: column;
    min-width: 0; min-height: 0; overflow: hidden;
  }
  .term-host.vis { display: flex; flex: 1; }
  .term-host.focus-pane { outline: 1px solid #4a4a4a; outline-offset: -1px; }
  .xterm { width: 100%; height: 100%; }
  .xterm-viewport { overflow-y: hidden !important; }
  .split-bar { flex-shrink: 0; background: #2a2a2a; transition: background 0.15s; }
  .split-bar.vert  { width: 4px; cursor: col-resize; }
  .split-bar.horiz { height: 4px; cursor: row-resize; }
  .split-bar:hover, .split-bar.dragging { background: #555; }
</style>
</head>
<body>
<div id="wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
'use strict';

// ── 全域 JS 錯誤上報 ─────────────────────────────────────────────
window.onerror = (msg, src, line) => {
  try { window.chrome.webview.postMessage(JSON.stringify({ type:'jserr', msg:String(msg), src, line })); } catch{}
};

const terms   = {};
let _u11Loaded  = false;
let _layoutPanes = [];   // 目前可見的 pane ID 陣列

const THEME = {
  background:'#1a1a1a', foreground:'#d4d4d4',
  cursor:'#d4a017', cursorAccent:'#1a1a1a',
  selectionBackground:'rgba(212,160,23,0.3)',
  black:'#1a1a1a',   brightBlack:'#555555',
  red:'#f44747',     brightRed:'#f44747',
  green:'#6a9955',   brightGreen:'#b5cea8',
  yellow:'#d7ba7d',  brightYellow:'#d7ba7d',
  blue:'#569cd6',    brightBlue:'#9cdcfe',
  magenta:'#c586c0', brightMagenta:'#c586c0',
  cyan:'#4ec9b0',    brightCyan:'#4ec9b0',
  white:'#d4d4d4',   brightWhite:'#ffffff',
};

// ── Unicode11: Nerd Font 寬度修正（必須在第一批輸出前就緒）───────
(function loadUnicode11() {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/xterm-addon-unicode11@0.8.0/lib/xterm-addon-unicode11.js';
  s.onload  = () => { _u11Loaded = true;  sendReady(); };
  s.onerror = () => { _u11Loaded = false; sendReady(); };
  document.head.appendChild(s);
})();

function sendReady() {
  window.chrome.webview.postMessage(JSON.stringify({ type: 'ready' }));
}

// ── 快捷鍵攔截（capture 優先於 xterm handler）────────────────────
// Alt+Shift+= → splitVertical, Alt+Shift+- → splitHorizontal, Alt+Shift+W → closeSplitPane
window.addEventListener('keydown', e => {
  if (e.altKey && e.shiftKey) {
    let hk = null;
    if (e.key === '=' || e.key === '+') hk = 'splitVertical';
    else if (e.key === '-' || e.key === '_') hk = 'splitHorizontal';
    else if (e.key === 'W' || e.key === 'w') hk = 'closeSplitPane';
    if (hk) {
      e.preventDefault();
      e.stopImmediatePropagation();
      window.chrome.webview.postMessage(JSON.stringify({ type: 'hotkey', key: hk }));
    }
  }
}, true);

// ── Terminal 建立 ─────────────────────────────────────────────────

function createTerminal(id) {
  if (terms[id]) return;

  const host = document.createElement('div');
  host.className = 'term-host';
  host.id = 'host-' + id;
  document.getElementById('wrap').appendChild(host);

  const term = new Terminal({
    theme: THEME,
    fontFamily: '"CaskaydiaCove NF", "CaskaydiaCove NFM", "Cascadia Code", "Consolas", monospace',
    fontSize: 14,
    lineHeight: 1.2,
    cursorBlink: true,
    cursorStyle: 'block',
    allowTransparency: false,
    scrollback: 5000,
  });

  if (_u11Loaded && typeof Unicode11Addon !== 'undefined') {
    try {
      const u11 = new Unicode11Addon.Unicode11Addon();
      term.loadAddon(u11);
      term.unicode.activeVersion = '11';
    } catch(_) {}
  }

  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(host);

  term.onData(data => {
    window.chrome.webview.postMessage(JSON.stringify({ type:'input', id, data }));
  });
  term.onResize(({ cols, rows }) => {
    window.chrome.webview.postMessage(JSON.stringify({ type:'resize', id, cols, rows }));
  });

  // 分割模式下：mousedown → 通知 C# 切換焦點窗格
  host.addEventListener('mousedown', () => {
    if (_layoutPanes.length < 2) return;
    _layoutPanes.forEach(pid => terms[pid]?.host.classList.remove('focus-pane'));
    host.classList.add('focus-pane');
    window.chrome.webview.postMessage(JSON.stringify({ type: 'paneactive', id }));
  }, true);

  terms[id] = { term, fit, host };
}

// ── 佈局管理 ─────────────────────────────────────────────────────

function setLayout(paneIds, direction) {
  _layoutPanes = paneIds;

  // 隱藏所有 term-host
  document.querySelectorAll('.term-host').forEach(h => {
    h.classList.remove('vis', 'focus-pane');
    h.style.flex = '';
  });
  // 移除舊分割條
  document.querySelectorAll('.split-bar').forEach(b => b.remove());

  const wrap = document.getElementById('wrap');
  wrap.style.flexDirection = direction === 'horizontal' ? 'column' : 'row';

  if (!paneIds.length) return;

  if (paneIds.length === 1 || direction === 'none') {
    const t = terms[paneIds[0]];
    if (t) t.host.classList.add('vis');
  } else {
    const t0 = terms[paneIds[0]];
    const t1 = terms[paneIds[1]];
    if (t0) t0.host.classList.add('vis', 'focus-pane');
    if (t1) t1.host.classList.add('vis');
    if (t0 && t1) t0.host.after(makeBar(direction === 'horizontal', paneIds));
  }

  requestAnimationFrame(fitAll);
}

function makeBar(isHoriz, paneIds) {
  const bar = document.createElement('div');
  bar.className = 'split-bar ' + (isHoriz ? 'horiz' : 'vert');

  let dragging = false;
  bar.addEventListener('mousedown', e => { dragging = true; bar.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const wrap = document.getElementById('wrap');
    const rect = wrap.getBoundingClientRect();
    const t0   = terms[paneIds[0]];
    const t1   = terms[paneIds[1]];
    if (!t0 || !t1) return;
    const p = Math.max(0.1, Math.min(0.9,
      isHoriz ? (e.clientY - rect.top)  / rect.height
              : (e.clientX - rect.left) / rect.width));
    t0.host.style.flex = `${p} 1 0%`;
    t1.host.style.flex = `${1 - p} 1 0%`;
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; bar.classList.remove('dragging'); fitAll(); }
  });
  return bar;
}

function fitAll() {
  _layoutPanes.forEach(id => { if (terms[id]) terms[id].fit.fit(); });
}

// ── 資料橋接 ─────────────────────────────────────────────────────

function writeToTerminal(id, b64) {
  if (!terms[id]) return;
  const binary = atob(b64);
  const bytes  = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  terms[id].term.write(bytes);
}

function removeTerminal(id) {
  if (!terms[id]) return;
  terms[id].term.dispose();
  terms[id].host.remove();
  delete terms[id];
  _layoutPanes = _layoutPanes.filter(p => p !== id);
}

// ── 訊息處理 ─────────────────────────────────────────────────────

window.chrome.webview.addEventListener('message', ev => {
  let msg;
  try { msg = JSON.parse(ev.data); } catch { return; }

  switch (msg.type) {
    case 'create':
      // 新 tab 第一次建立
      createTerminal(msg.id);
      setLayout([msg.id], 'none');
      break;

    case 'switch':
      // 切換 tab（含分割佈局資訊）
      setLayout(msg.panes || [msg.id], msg.direction || 'none');
      if (terms[msg.id]) terms[msg.id].term.focus();
      break;

    case 'write':
      writeToTerminal(msg.id, msg.data);
      break;

    case 'remove':
      removeTerminal(msg.id);
      break;

    case 'split':
      // 建立分割窗格
      createTerminal(msg.newId);
      setLayout([msg.existingId, msg.newId], msg.direction);
      if (terms[msg.newId]) terms[msg.newId].term.focus();
      break;

    case 'closepane':
      // 關閉分割窗格，回到單窗格
      removeTerminal(msg.paneId);
      setLayout([msg.keepId], 'none');
      if (terms[msg.keepId]) { terms[msg.keepId].term.focus(); }
      break;
  }
});

window.addEventListener('resize', fitAll);
</script>
</body>
</html>
